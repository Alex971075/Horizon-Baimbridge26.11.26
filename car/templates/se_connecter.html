<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connexion - Baimbridge Horizon</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>

<body>
<div class="container">


<nav class="navbar navbar-expand-lg navbar-dark barre-menu mb-4 mt-3">
    <div class="container-fluid">
        <a class="navbar-brand" href="/accueil"><i class="bi bi-car-front-fill"></i> Baimbridge Horizon</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/accueil">Accueil</a>
            <a class="nav-link" href="/ajouter_etudiant">Créer un compte</a>
        </div>
    </div>
</nav>

<!-- formulaire de connexion au milieu de la page -->
<div class="boite-connexion">

    <div class="text-center mb-4">
        <div class="icone-ronde"><i class="bi bi-person-circle"></i></div>
        <h1>S'identifier</h1>
        <p class="text-muted">Seront marqués par * les cases obligatoires.</p>
    </div>

    <form method="GET" class="formulaire mb-3">
        <label class="form-label">Email*</label>
        <input type="text" name="email" class="form-control mb-2" placeholder="exemple@mail.fr">

        <label class="form-label">Mot de Passe*</label>
        <input type="password" name="passwd" class="form-control mb-3">

        <input type="submit" value="Se connecter" class="btn btn-jaune w-100">
    </form>

    <!-- message d'erreur si mauvais mail ou mdp -->
    {% if message %}
    <p class="alert alert-danger"><i class="bi bi-exclamation-triangle"></i> {{ message }}</p>
    {% endif %}

    <p class="text-center">Pas encore de compte ? <a href="/ajouter_etudiant">Créer un compte</a></p>
</div>

<footer class="pied-de-page">
    Baimbridge Horizon - Covoiturage du lycée Baimbridge, Les Abymes (Guadeloupe)
</footer>

</div>
</body>
</html>
